<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit Models</title>
<style>
  :root { --bg: #b9b49f; --ink: #1d1b16; --panel: rgba(255, 252, 240, 0.9); --accent: #7a4a1a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; top: 12px; left: 12px; background: var(--panel); padding: 10px 12px; border-radius: 8px; max-width: calc(100% - 48px); }
  #ui button { margin: 2px; padding: 4px 10px; border: 1px solid #8a7a5a; background: #fffaf0; border-radius: 5px; cursor: pointer; }
  #ui button.on { background: var(--accent); color: #fff; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels div { position: absolute; transform: translate(-50%, 0); font-size: 12px; background: rgba(255, 252, 240, 0.8); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
</style>
</head>
<body>
<div id="ui"><div id="anims"></div><div id="hint" style="font-size:12px;opacity:.7">drag to turn, wheel to zoom</div></div>
<div id="labels"></div>
<script type="module" src="./units-viewer.ts"></script>
</body>
</html>
